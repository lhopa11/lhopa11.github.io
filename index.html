<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:'Cairo',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:linear-gradient(180deg,#171717,#101010);border:1px solid #222;padding:35px 25px;border-radius:28px;box-shadow:0 0 50px rgba(0,255,136,0.18);max-width:420px;width:100%;text-align:center;animation:up 0.8s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(45deg,#00ff88,#00ccff);margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:50px;color:black;font-weight:900;border:3px solid #00ff88;box-shadow:0 0 25px #00ff88}
h1{color:white;font-size:44px;margin:0;letter-spacing:4px;font-weight:900}
h1 span{color:#00ff88;text-shadow:0 0 20px #00ff88}
.bio{color:#999;margin:12px 0 20px;font-size:14px;line-height:1.6}
.links{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.link-btn{background:#1c1c1c;border:1px solid #2a2a2a;color:white;padding:14px;border-radius:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;transition:0.2s;font-weight:700}
.link-btn:hover{transform:scale(1.03);background:#222;border-color:#00ff88;color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.3)}
.link-btn.primary{background:#00ff88;color:black;border-color:#00ff88}
.link-btn.primary:hover{box-shadow:0 0 25px #00ff88}
.badges{margin-top:22px}
.badge{background:#111;padding:6px 12px;border-radius:20px;font-size:11px;margin:3px;display:inline-block;border:1px solid #222;color:#888}
.footer{margin-top:25px;color:#444;font-size:11px}
</style>
</head>
<body>
