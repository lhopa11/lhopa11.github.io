<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title><style>body{margin:0;background:#0d1117;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif}canvas{background:#161b22;border:2px solid #30363d;border-radius:12px}#s{font-size:28px;font-weight:700;margin:8px}button{margin-top:8px;background:#238636;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:700}</style></head>
<body><div id="s"><span id="p">0</span>-<span id="c">0</span> | Best:<span id="b">0</span></div><canvas id="g" width="800" height="450"></canvas><button id="btn" onclick="S()">Play Again</button>
<script>
C=document.getElementById('g');X=C.getContext('2d');pY=cY=180;bX=400;bY=225;vX=vY=0;pS=cS=0;pl=0;B=localStorage.getItem('pb')||0;document.getElementById('b').innerText=B;
function S(){vX=Math.random()>0.5?5:-5;vY=Math.random()*4-2;pl=1;btn.style.display='none'}
function R(){bX=400;bY=225;vX=vY=0;pl=0;btn.style.display='inline-block'}
C.onmousemove=e=>{pY=e.clientY-C.getBoundingClientRect().top-50}
onkeydown=e=>{if(e.key==' ')S();if(e.key=='ArrowUp')pY-=25;if(e.key=='ArrowDown')pY+=25}
setInterval(()=>{
if(!pl)return;bX+=vX;bY+=vY;if(bY<0||bY>450)vY*=-1;
if(bX<30&&bY>pY&&bY<pY+100){vX*=-1.1;bX=30}
if(bX>758&&bY>cY&&bY<cY+100){vX*=-1.1;bX=758}
cY+=(bY-(cY+50))*.07;
if(bX<0){cS++;R()}if(bX>800){pS++;if(pS>B){B=pS;localStorage.setItem('pb',B)}R()}
p.textContent=pS;c.textContent=cS;b.textContent=B;pY=Math.max(0,Math.min(350,pY));cY=Math.max(0,Math.min(350,cY))
},16);
(function D(){X.clearRect(0,0,800,450);X.fillStyle='#fff';X.fillRect(15,pY,12,100);X.fillRect(773,cY,12,100);X.beginPath();X.arc(bX,bY,10,0,6.28);X.fill();requestAnimationFrame(D)})()
</script></body></html>
